<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>四语日课</title>
  <style>
    :root{--ink:#18241b;--muted:#667168;--paper:#f7f8f4;--card:#fff;--line:#dce4dc;--green:#2d713f;--soft:#e7f2e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}.app{max-width:1080px;margin:0 auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px}.brand{font-weight:750;letter-spacing:.04em}.small{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:175px minmax(0,1fr);gap:30px}aside{border-right:1px solid var(--line);padding-right:16px}.nav{width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:10px;font:inherit;color:inherit;cursor:pointer;margin:2px 0}.nav.active{background:var(--soft);color:#174321;font-weight:700}main h1{font-size:32px;line-height:1.2;margin:0}.date,.subtitle{color:var(--muted)}.date{margin:0 0 5px;font-size:13px}.subtitle{margin:8px 0 22px}.source{display:grid;grid-template-columns:minmax(0,1fr) 165px;gap:16px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px}.source h2{font-size:15px;margin:0 0 10px}.source p{margin:0}.korean{font-weight:700}.topic{align-self:start;background:var(--soft);color:#1c4b28;border-radius:10px;padding:10px;font-size:14px}.topic small{display:block;opacity:.75}.translations{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.translation{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;min-height:225px}.translation-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}.translation-head b{font-size:16px;color:var(--ink)}.sentence{font-size:18px;margin:15px 0 6px}.key{font:inherit;padding:0;border:0;background:transparent;color:inherit;text-decoration:underline;text-decoration-color:#69a778;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer}.pron{color:var(--muted);font-size:12px;margin:0}.card-words{border-top:1px solid var(--line);margin-top:13px;padding-top:11px}.card-words span{color:var(--muted);font-size:12px;margin-right:7px}.word{padding:5px 8px;border:1px solid var(--line);background:var(--card);border-radius:999px;font:inherit;font-size:12px;cursor:pointer;margin:3px 3px 0 0}.word.active{border-color:transparent;background:var(--soft);color:#194627}.word-detail{margin:9px 0 0;color:var(--muted);font-size:12px}.word-detail b{color:var(--ink)}.history{margin-top:22px}.history button{display:block;width:100%;text-align:left;padding:9px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}.history button:hover{color:var(--green)}.hidden{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:18px}aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}.source,.translations{grid-template-columns:1fr}.translation{min-height:0}header .small{display:none}main h1{font-size:28px}}
  </style>
</head>
<body><div class="app"><header><div class="brand">四语日课</div><div class="small">每日三句关联表达 · 自动更新</div></header><div class="layout"><aside><button class="nav active" data-page="today">今日一课</button><button class="nav" data-page="history">历史日课</button></aside><main><section id="today"><p class="date" id="date"></p><h1 id="topic"></h1><p class="subtitle">从三句关联的韩语原文出发，理解四种自然表达。</p><section class="source"><div><h2>今日原文 · <span id="sourceLanguage"></span></h2><p class="korean" id="sourceText"></p><p class="small" id="sourceGloss"></p></div><div class="topic"><small>今日学习重点</small><b id="topicTag"></b></div></section><section class="translations" id="translations"></section></section><section id="history" class="hidden"><p class="date">已发布内容</p><h1>历史日课</h1><p class="subtitle">选择一天，重新打开那天的四语表达。</p><div class="history" id="historyList"></div></section></main></div></div><script>
const $=s=>document.querySelector(s);let lesson;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function marked(text,words){let out=esc(text);for(const word of words){out=out.replace(esc(word.term),`<button class="key" data-key="${esc(word.term)}">${esc(word.term)}</button>`)}return out}
function showDetail(word,card){card.querySelector('.word-detail').innerHTML=`<b>${esc(word.term)}</b> · ${esc(word.pronunciation)}<br>${esc(word.meaningZh)}：${esc(word.explanationZh)}`;card.querySelectorAll('.word').forEach(x=>x.classList.toggle('active',x.dataset.key===word.term))}
function render(data){lesson=data;$('#date').textContent=`${data.date} · 第 ${data.day} 日`;$('#topic').textContent=data.topic;$('#topicTag').textContent=data.topic;$('#sourceLanguage').textContent=data.source.language;$('#sourceText').textContent=data.source.text;$('#sourceGloss').textContent=data.source.glossZh;$('#translations').innerHTML=data.translations.map(t=>`<article class="translation"><div class="translation-head"><b>${esc(t.language)}</b><span>${esc(t.style)}</span></div><p class="sentence">${marked(t.text,t.keywords)}</p><p class="pron">${esc(t.pronunciation)}</p><div class="card-words"><span>${esc(t.language)}重点词</span>${t.keywords.map(w=>`<button class="word" data-key="${esc(w.term)}">${esc(w.term)} · ${esc(w.meaningZh)}</button>`).join('')}<p class="word-detail"></p></div></article>`).join('');document.querySelectorAll('.translation').forEach((card,index)=>{const words=data.translations[index].keywords;card.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>showDetail(words.find(w=>w.term===e.dataset.key),card));showDetail(words[0],card)})}
async function load(){try{render(await fetch('content/latest.json').then(r=>r.json()));const index=await fetch('content/index.json').then(r=>r.json());$('#historyList').innerHTML=index.map(x=>`<button data-file="${esc(x.file)}">${esc(x.date)}　${esc(x.topic)}</button>`).join('');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{render(await fetch('content/'+b.dataset.file).then(r=>r.json()));document.querySelector('[data-page="today"]').click()})}catch(e){$('#topic').textContent='内容加载失败';$('.subtitle').textContent='请稍后刷新页面。'}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));['today','history'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.page))});load();
</script></body></html>
