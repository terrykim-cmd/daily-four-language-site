<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>四语日课</title>
  <style>
    :root{--ink:#18241b;--muted:#667168;--paper:#f7f8f4;--card:#fff;--line:#dce4dc;--green:#2d713f;--soft:#e7f2e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}.app{max-width:1080px;margin:0 auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px}.brand{font-weight:750;letter-spacing:.04em}.small{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:175px minmax(0,1fr);gap:30px}aside{border-right:1px solid var(--line);padding-right:16px}.nav{width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:10px;font:inherit;color:inherit;cursor:pointer;margin:2px 0}.nav.active{background:var(--soft);color:#174321;font-weight:700}main h1{font-size:32px;line-height:1.2;margin:0}.date,.subtitle{color:var(--muted)}.date{margin:0 0 5px;font-size:13px}.subtitle{margin:8px 0 22px}.source{display:grid;grid-template-columns:minmax(0,1fr) 165px;gap:16px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px}.source h2{font-size:15px;margin:0 0 10px}.source p{margin:0}.korean{font-weight:700}.topic{align-self:start;background:var(--soft);color:#1c4b28;border-radius:10px;padding:10px;font-size:14px}.topic small{display:block;opacity:.75}.translations{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.translation{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;min-height:225px}.translation-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}.translation-head b{font-size:16px;color:var(--ink)}.sentence{font-size:18px;margin:15px 0 6px}.key{font:inherit;padding:0;border:0;background:transparent;color:inherit;text-decoration:underline;text-decoration-color:#b7c1b8;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}.key.focus{color:#194627;text-decoration-color:#4c9a60;text-decoration-thickness:2px}.pron{color:var(--muted);font-size:12px;margin:0}.card-words{border-top:1px solid var(--line);margin-top:13px;padding-top:11px}.card-words span{color:var(--muted);font-size:12px;margin-right:7px}.word-detail{margin:9px 0 0;color:var(--muted);font-size:12px}.word-detail b{color:var(--ink)}.history-filters{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}.filter{padding:6px 10px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}.filter.active{border-color:transparent;background:var(--soft);color:#194627}.history{margin-top:12px}.history button{display:block;width:100%;text-align:left;padding:11px 9px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}.history button small{display:block;color:var(--muted);margin-top:2px}.history button:hover{color:var(--green)}.hidden{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:18px}aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}.source,.translations{grid-template-columns:1fr}.translation{min-height:0}header .small{display:none}main h1{font-size:28px}}
  </style>
</head>
<body><div class="app"><header><div class="brand">四语日课</div><div class="small">每日三句关联表达 · 自动更新</div></header><div class="layout"><aside><button class="nav active" data-page="today">今日一课</button><button class="nav" data-page="history">历史日课</button></aside><main><section id="today"><p class="date" id="date"></p><h1 id="topic"></h1><p class="subtitle">点击句中任一划线词查看释义；绿色下划线表示重点词。</p><section class="source"><div><h2>今日原文 · <span id="sourceLanguage"></span></h2><p class="korean" id="sourceText"></p><p class="small" id="sourceGloss"></p></div><div class="topic"><small>今日学习重点</small><b id="topicTag"></b></div></section><section class="translations" id="translations"></section></section><section id="history" class="hidden"><p class="date">已发布内容</p><h1>历史日课</h1><p class="subtitle">按分类筛选，重新打开那天的四语表达。</p><div class="history-filters" id="historyFilters"></div><div class="history" id="historyList"></div></section></main></div></div><script>
const $=s=>document.querySelector(s);let lesson;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function annotation(t){const words=t.vocabulary?.length?t.vocabulary:t.keywords;const focus=new Set(words.filter(w=>w.focus).map(w=>w.term));return{focus,words:[...words].sort((a,b)=>b.term.length-a.term.length)}}
function marked(text,words,focus){let out='',i=0;while(i<text.length){const word=words.find(w=>text.startsWith(w.term,i));if(word){out+=`<button class="key${focus.has(word.term)?' focus':''}" data-key="${esc(word.term)}">${esc(word.term)}</button>`;i+=word.term.length}else{out+=esc(text[i++])}}return out}
function showDetail(word,card){card.querySelector('.word-detail').innerHTML=`<b>${esc(word.term)}</b> · ${esc(word.pronunciation||word.term)}<br>${esc(word.meaningZh)}：${esc(word.explanationZh||'本句中的基础词，请结合整句理解。')}`;card.querySelectorAll('[data-key]').forEach(x=>x.classList.toggle('active',x.dataset.key===word.term))}
function render(data){lesson=data;$('#date').textContent=`${data.date} · 第 ${data.day} 日`;$('#topic').textContent=data.topic;$('#topicTag').textContent=data.topic;$('#sourceLanguage').textContent=data.source.language;$('#sourceText').textContent=data.source.text;$('#sourceGloss').textContent=data.source.glossZh;const annotations=data.translations.map(annotation);$('#translations').innerHTML=data.translations.map((t,i)=>{const a=annotations[i];return `<article class="translation"><div class="translation-head"><b>${esc(t.language)}</b><span>${esc(t.style)}</span></div><p class="sentence">${marked(t.text,a.words,a.focus)}</p><p class="pron">${esc(t.pronunciation)}</p><div class="card-words"><span>逐词释义 · 点击划线词</span><p class="word-detail"></p></div></article>`}).join('');document.querySelectorAll('.translation').forEach((card,index)=>{const words=annotations[index].words;card.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>showDetail(words.find(w=>w.term===e.dataset.key),card));showDetail(words[0],card)})}
function renderHistory(index,category='全部'){const shown=category==='全部'?index:index.filter(x=>x.category===category);$('#historyList').innerHTML=shown.map(x=>`<button data-file="${esc(x.file)}">${esc(x.date)}　${esc(x.topic)}<small>${esc(x.category)}</small></button>`).join('');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{render(await fetch('content/'+b.dataset.file,{cache:'no-store'}).then(r=>r.json()));document.querySelector('[data-page="today"]').click()})}
async function load(){try{render(await fetch('content/latest.json',{cache:'no-store'}).then(r=>r.json()));const index=await fetch('content/index.json',{cache:'no-store'}).then(r=>r.json());const categories=['全部',...new Set(index.map(x=>x.category))];$('#historyFilters').innerHTML=categories.map((x,i)=>`<button class="filter${i?'':' active'}" data-category="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));renderHistory(index,b.dataset.category)});renderHistory(index)}catch(e){$('#topic').textContent='内容加载失败';$('.subtitle').textContent='请稍后刷新页面。'}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));['today','history'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.page))});load();
</script></body></html>
