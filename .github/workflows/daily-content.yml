name: Generate daily lesson

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate four-language lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-astra
        run: node scripts/generate-daily.mjs
      - name: Commit new lesson
        run: |
          git config user.name "daily-language-bot"
          git config user.email "daily-language-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "content: add daily lesson"
          git push
